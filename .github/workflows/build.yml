name: Build KickflipOS

# Every push builds the ISO from source and boot-tests it in QEMU.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev \
            cpio xz-utils grub-pc-bin grub-common xorriso mtools console-setup-linux \
            qemu-system-x86

      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Build the ISO
        run: ./build.sh

      - name: Boot-test it
        run: python3 tests/smoke_test.py

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot
          path: build/screenshot.png
          if-no-files-found: ignore
